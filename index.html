<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiftFit</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a7de1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a coach that fits a crane operator's 12-hour rotation
   IDEA a shipped Android app whose whole day re-plans around the shift calendar
   PICTURE the day card in shift colour with a progress ring, and a seated figure in a hi-vis vest demoing each stretch
   COLOUR white or near-black ground; day blue and night coral (same as Supershift), recovery violet, days-off crane yellow
   TYPE Figtree throughout
   LAYOUT one phone column (max 480px), centred on wider screens; bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1014);--out:light-dark(#eceef1,#060708);--card:light-dark(#f3f4f6,#191c22);--ink:light-dark(#12151a,#eef0f3);--mut:light-dark(#5a616c,#9ba3ae);--line:light-dark(#e1e4e8,#2a2f37);--day:#2a7de1;--night:#e5484d;--rec:#7c5cd6;--off:#c98f00;--vest:#f5b700;--bsil:light-dark(#e6e9ed,#2a2f37);--bo:light-dark(#d3d8df,#3a404a);--bline:light-dark(#b9c0ca,#4c5360);--bsec:light-dark(#f7b3b5,#8a3a3d);--bsecl:light-dark(#e08a8d,#b0575b);--skin:light-dark(#c7ced8,#6b7482);--limb:light-dark(#2b3240,#cfd5dd)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--out);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--day);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:96px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:grid;place-items:center}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pad{padding:0 16px}
h2{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:10px 0 4px;font-weight:800}
h3{font-size:17px;margin:22px 0 10px;font-weight:700}
.mut{color:var(--mut)}
.small{font-size:13px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.dc{flex:none;scroll-snap-align:start;width:52px;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 0 10px;display:grid;justify-items:center;gap:2px}
.dc span{font-size:13px;color:var(--mut)}.dc b{font-size:18px}
.dc i{font-style:normal;font-size:13px;font-weight:700;color:#fff;border-radius:8px;padding:0 7px;min-width:24px;text-align:center}
.dc.on{border-color:var(--ink);border-width:2px}
.hero{margin:0 16px;border-radius:24px;padding:20px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero h2{margin:0;font-size:30px;color:#fff}
.hero p{margin:4px 0 0;opacity:.92}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.stats{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;font-size:14px;opacity:.95}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 16px 0}
.nudge{display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;border-radius:22px;border:0;padding:0 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.plan{list-style:none;margin:0;padding:0 16px}
.pi{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tm{font-size:20px;font-weight:800;white-space:nowrap;line-height:1}
.tm small{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:3px}
.pb{border:0;background:none;text-align:left;padding:4px 0}
.pb b{display:block;font-weight:700}
.pb span{font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:0 6px;margin-right:6px;color:#fff}
.tg-s{background:var(--day)}.tg-m{background:#1f9d6b}.tg-f{background:var(--off)}.tg-w{background:var(--limb);color:var(--bg)}.tg-z{background:var(--rec)}
.ck{width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:none;display:grid;place-items:center}
.ck svg{width:20px;height:20px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.ck.y{background:#1f9d6b;border-color:#1f9d6b}.ck.y svg{opacity:1}
.pi.y .pb b{text-decoration:line-through;color:var(--mut)}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:36px;height:44px;border:2px solid var(--day);border-radius:4px 4px 10px 10px;background:none;position:relative;overflow:hidden}
.cup.y::after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:var(--day)}
.rc{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;border:0;text-align:left;width:100%;background:var(--card);border-radius:20px;padding:10px 14px 10px 10px;margin-bottom:10px}
.rc .fg{width:96px;height:96px;background:var(--bg);border-radius:14px}
.rc b{font-size:17px;display:block}.rc span{font-size:14px;color:var(--mut)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.lx{border:0;background:var(--card);border-radius:18px;padding:8px 8px 12px;text-align:center;font-weight:600;font-size:14px}
.lx .fg{width:100%;height:110px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-weight:600;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fc{display:inline-flex;align-items:center;border-radius:14px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--card)}
.hab{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.hab:last-child{border:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 16px}
.cal .wd{text-align:center;font-size:13px;color:var(--mut);padding:4px 0}
.cc{border:0;border-radius:12px;min-height:58px;padding:6px 2px;background:var(--card);display:grid;align-content:start;justify-items:center;gap:3px}
.cc b{font-size:15px}.cc i{font-style:normal;font-size:13px;font-weight:700;color:#fff;border-radius:6px;padding:0 4px}
.cc.now{outline:2px solid var(--ink)}
.cc.blank{background:none}
.mh{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.leg{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;font-size:13px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.blk{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border:0}.blk i{border-radius:4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--mut);padding:4px 0;min-height:52px}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.nav button.on svg{background:var(--card);border-radius:12px;width:56px;padding:0 16px;box-sizing:content-box;margin:0 -16px}
.q label.lb{display:block;font-weight:700;margin:18px 0 8px}
.q input[type=text],.q input[type=date],.q input[type=time],.q textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.q textarea{min-height:80px}
.tog{display:flex;align-items:center;gap:12px;margin-top:18px;font-weight:600}
.tog input{width:24px;height:24px;accent-color:var(--day)}
.bar{height:6px;border-radius:3px;background:var(--card);overflow:hidden;margin:6px 16px 0}
.bar i{display:block;height:100%;background:var(--ink)}
.qnav{display:flex;justify-content:space-between;gap:10px;padding:24px 16px}
#player{position:fixed;inset:0;z-index:10;display:none;justify-content:center;background:var(--out)}
#player.open{display:flex}
.pl{width:min(480px,100%);height:100%;overflow:auto;background:var(--bg);display:flex;flex-direction:column;padding:12px 16px 20px}
.segs{display:flex;gap:4px;margin:10px 0}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs i.d{background:var(--ink)}
.stage{background:var(--card);border-radius:24px;display:grid;place-items:center;padding:10px}
.stage .fg{width:min(100%,300px);height:auto;aspect-ratio:200/210}
.pt{font-size:56px;font-weight:800;text-align:center;line-height:1;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.cues{margin:8px 0 0;padding-left:20px}
.pctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:auto;padding-top:16px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%}
#toast.on{opacity:1}
.note{font-size:13px;color:var(--mut);padding:16px}
/* figure */
.fg .seat{fill:var(--line)}
.fg .lim{stroke:var(--limb);stroke-width:11;stroke-linecap:round;fill:none}
.fg .ft{stroke:var(--limb);stroke-width:9;stroke-linecap:round}
.fg .vest{fill:var(--vest)}.fg .strp{stroke:#e9edf2;stroke-width:4}
.fg .hdc{fill:var(--skin)}.fg .hat{fill:var(--vest)}
.fg g{transform-box:view-box}
.fg .cw{fill:light-dark(#d8e8f4,#1c2a39)}
.fg .cwl{stroke:light-dark(#c2d6e6,#243548);stroke-width:1}
.fg .cjib{fill:none;stroke:light-dark(#e0a400,#a87800);stroke-width:2;stroke-linecap:round;opacity:.55}
.fg .cframe{fill:none;stroke:light-dark(#9aa6b2,#3d4652);stroke-width:4}
.fg .sback{fill:#3b4049}.fg .sbol{fill:#31353d}.fg .shead{fill:#3b4049}.fg .spost{fill:#2a2e34}.fg .scush{fill:#3a3f48}.fg .slip{fill:#2c3037}.fg .tshadow{fill:rgba(0,0,0,.25)}.fg .khi{fill:none;stroke:#8b826f;stroke-width:1.4;stroke-linecap:round}.fg .jbtn{fill:#d94040}
.fg .jcon{fill:#454b55}.fg .jtop{fill:#575e69}.fg .jstick{stroke:#2a2e34;stroke-width:3;stroke-linecap:round}.fg .jknob{fill:#1f2328}
.fg .floor{fill:rgba(0,0,0,.18)}
.fg .pant{fill:#6b6253}.fg .pshade{fill:#584f42}.fg .knee{fill:#7b7262}.fg .pcrease,.fg .pocket{fill:none;stroke:#544c40;stroke-width:1}
.fg .boot{fill:#5a3e2b}.fg .bootcap{fill:#76553c}.fg .sole{fill:#22201e}.fg .lace{stroke:#3a281c;stroke-width:.9}
.fg .shirt{fill:#2f3f5c}.fg .sshade{fill:#243149}.fg .cuff{fill:#283752}
.fg .vest{fill:#f5b700}.fg .vshade{fill:#dc9f00}.fg .stripe{fill:#e8edf2;stroke:#aeb6c0;stroke-width:.6}
.fg .zip{stroke:#b88800;stroke-width:1}.fg .pocket2{fill:none;stroke:#c99600;stroke-width:1}
.fg .belt{fill:#2b2420}.fg .buckle{fill:#b8bec6}
.fg .skin{fill:#e2b48e}.fg .skinsh{fill:#cc9873}.fg .collar{fill:#22304a}
.fg .hair{fill:#5a4030}.fg .brow{fill:none;stroke:#4a3426;stroke-width:1.2;stroke-linecap:round}
.fg .eye{fill:#2a2420}.fg .nose{fill:none;stroke:#b98462;stroke-width:1;stroke-linecap:round}.fg .mouth{fill:none;stroke:#9b5f4c;stroke-width:1.2;stroke-linecap:round}
.fg .hat{fill:#f5b700}.fg .hatsh{fill:#d89c00}.fg .hathi{fill:none;stroke:#ffd75a;stroke-width:2;stroke-linecap:round}.fg .hatrib{stroke:#dca200;stroke-width:2}
.fg .glove{fill:#c9a46c}.fg .gshade{fill:#a98650}
.fg g{transform-box:view-box}
.tor{transform-origin:100px 142px}.hd{transform-origin:100px 66px}
.aL{transform-origin:78px 82px}.aR{transform-origin:122px 82px}
.lL{transform-origin:90px 144px}.lR{transform-origin:110px 144px}
.sR{transform-origin:117px 160px}.fL{transform-origin:83px 190px}.fR{transform-origin:117px 190px}
.a-tilt .hd{animation:tilt 5s ease-in-out infinite}
.a-tuck .hd{animation:tuck 2.4s ease-in-out infinite}
.a-shrug .aL,.a-shrug .aR,.a-shrug .hd{animation:shrug 2.4s ease-in-out infinite}
.a-twist .tor{animation:twist 4s ease-in-out infinite}.a-twist .hd{animation:look 4s ease-in-out infinite}
.a-side .tor{animation:side 4s ease-in-out infinite}.a-side .aR{animation:up 4s ease-in-out infinite}
.a-chest .aL{transform:rotate(112deg);animation:chL 3s ease-in-out infinite}.a-chest .aR{transform:rotate(-112deg);animation:chR 3s ease-in-out infinite}
.a-reach .aL{animation:rL 3.5s ease-in-out infinite}.a-reach .aR{animation:rR 3.5s ease-in-out infinite}
.a-fig4 .sR{animation:f4 4s ease-in-out infinite}.a-fig4 .tor{animation:lean 4s ease-in-out infinite}.a-fig4 .hd{animation:leanH 4s ease-in-out infinite}
.a-knee .lL{animation:kn 2.4s ease-in-out infinite}.a-knee .lR{animation:kn 2.4s ease-in-out 1.2s infinite}
.a-ankle .fL,.a-ankle .fR{animation:ank 1.6s ease-in-out infinite}
.a-fold .tor{animation:fold 5s ease-in-out infinite}.a-fold .hd{animation:unsq 5s ease-in-out infinite}
.a-breathe .tor{animation:br 6s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-22deg)}75%{transform:rotate(22deg)}}
@keyframes tuck{0%,100%{transform:none}50%{transform:translateY(4px) scale(.94)}}
@keyframes shrug{0%,100%{transform:none}50%{transform:translateY(-8px)}}
@keyframes twist{0%,100%{transform:none}50%{transform:scaleX(.8)}}
@keyframes look{0%,100%{transform:none}50%{transform:translateX(8px) scaleX(1.15)}}
@keyframes side{0%,100%{transform:none}50%{transform:rotate(-16deg)}}
@keyframes up{0%,100%{transform:none}50%{transform:rotate(-165deg)}}
@keyframes chL{0%,100%{transform:rotate(104deg)}50%{transform:rotate(124deg)}}
@keyframes chR{0%,100%{transform:rotate(-104deg)}50%{transform:rotate(-124deg)}}
@keyframes rL{0%,100%{transform:none}50%{transform:rotate(172deg)}}
@keyframes rR{0%,100%{transform:none}50%{transform:rotate(-172deg)}}
@keyframes f4{0%,100%{transform:none}30%,70%{transform:translateY(-4px) rotate(100deg)}}
@keyframes lean{0%,30%,100%{transform:none}55%{transform:scaleY(.9)}}
@keyframes leanH{0%,30%,100%{transform:none}55%{transform:scaleY(1.11)}}
@keyframes kn{0%,100%{transform:none}50%{transform:translateY(-16px)}}
@keyframes ank{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes fold{0%,100%{transform:none}50%{transform:scale(.96,.68)}}
@keyframes unsq{0%,100%{transform:none}50%{transform:scale(1.04,1.47)}}
@keyframes br{0%,100%{transform:none}50%{transform:scale(1.05)}}
.fg .tgt{fill:var(--night);opacity:.55}
.fg .arw{fill:none;stroke:var(--day);stroke-width:3.5;stroke-linecap:round}.fg .ahp{fill:var(--day)}
.p-tilt .hd{transform:rotate(22deg)}.p-tuck .hd{transform:translateY(3px) scale(.95)}
.p-shrug .aL,.p-shrug .aR,.p-shrug .hd{transform:translateY(-7px)}
.p-twist .tor{transform:scaleX(.8)}.p-twist .hd{transform:translateX(8px) scaleX(1.15)}
.p-side .tor{transform:rotate(-16deg)}.p-side .aR{transform:rotate(-165deg)}
.p-chest .aL{transform:rotate(118deg)}.p-chest .aR{transform:rotate(-118deg)}
.p-reach .aL{transform:rotate(172deg)}.p-reach .aR{transform:rotate(-172deg)}
.p-fig4 .sR{transform:translateY(-4px) rotate(100deg)}.p-fig4 .tor{transform:scaleY(.92)}.p-fig4 .hd{transform:scaleY(1.087)}
.p-knee .lL{transform:translateY(-16px)}
.p-ankle .fL,.p-ankle .fR{transform:rotate(-28deg)}
.p-fold .tor{transform:scale(.96,.68)}.p-fold .hd{transform:scale(1.04,1.47)}
.p-breathe .tor{transform:scale(1.05)}
.feel{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}.feel i{width:14px;height:14px;border-radius:7px;background:var(--night);opacity:.7}
.vid{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:24px;background:var(--day);color:#fff;font-weight:700;text-decoration:none;margin-top:12px}
.vid svg{width:20px;height:20px;fill:#fff}
.yt{flex:none;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}.yt iframe{width:100%;height:100%;border:0;display:block}
.vtog{display:flex;gap:6px;justify-content:center;margin-top:10px}

.tg-g{background:#c2410c}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.setb{flex:1;min-width:64px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.setb.y{background:#1f9d6b;border-color:#1f9d6b;color:#fff}
.rt{font-size:22px;font-weight:800;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.wrow{display:flex;align-items:center;gap:10px;margin:10px 0 6px;font-weight:700}
.wrow input{width:110px;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.rot{display:grid;gap:6px;padding:0 16px}
.rc2{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;padding:4px 0;border-bottom:1px solid var(--line)}
.rc2 i{font-style:normal;font-weight:700;font-size:13px;border-radius:8px;padding:3px 10px;white-space:nowrap}
.wl{list-style:none;margin:10px 0 0;padding:0}
.wl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.wl li span:last-child{white-space:nowrap;color:var(--mut)}
.wdot{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:13px;color:#fff;font-size:14px;margin-right:6px;vertical-align:1px}

.bm{display:block;width:100%;max-width:340px;margin:6px auto 0}
.bm .bsil{fill:var(--bsil);stroke:var(--bsil);stroke-width:3;stroke-linejoin:round}
.bm .bo{fill:var(--bo);stroke:var(--bline);stroke-width:.8}
.bm .bp{fill:url(#gbp);stroke:#a8232a;stroke-width:.8}
.bm .bs{fill:var(--bsec);stroke:var(--bsecl);stroke-width:.8}
.bm text{font-size:13px;fill:var(--mut);font-family:inherit}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:14px;margin:4px 0 0}
.mleg span{display:inline-flex;align-items:center;gap:6px}.mleg i{width:12px;height:12px;border-radius:6px;display:inline-block}
.mcard{background:var(--card);border-radius:20px;padding:10px 12px 12px;margin-top:12px}

#sheet{position:fixed;inset:0;z-index:11;display:none;justify-content:center;background:var(--out)}
#sheet.open{display:flex}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;gap:6px}
.kbig{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:12px}
.kbar i{display:block;height:100%;border-radius:5px}
.kbar.sm{height:6px;margin-top:4px}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.mhd{display:flex;align-items:center;gap:10px}
