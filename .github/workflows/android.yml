name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        shell: bash
        run: bash android/build.sh 2>&1 | tee build.log
      - name: Save build log for debugging
        if: always()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "build step never started" > /tmp/build.log
          git config user.name "ShiftFit CI"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-logs
      - uses: actions/upload-artifact@v4
        with:
          name: ShiftFit-apk
          path: ShiftFit.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ShiftFit Android app (build ${{ github.run_number }})
          body: "Tap ShiftFit.apk below to download, then open it to install. The app loads the live ShiftFit site, so app content updates by itself."
          files: ShiftFit.apk
          make_latest: true
